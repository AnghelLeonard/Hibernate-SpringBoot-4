app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool sizing (adjust based on your CPU cores and database limits)
app.datasource.initial-size=10
app.datasource.max-total=30
app.datasource.max-idle=15
app.datasource.min-idle=5

# Timeouts and concurrency (fail fast for web requests)
app.datasource.max-wait-millis=5000

# Connection validation (prevent stale/broken socket errors)
app.datasource.test-on-borrow=true
app.datasource.test-while-idle=true
app.datasource.validation-query=SELECT 1
app.datasource.validation-query-timeout=3

# Idle eviction (clean up unused connections safely)
app.datasource.time-between-eviction-runs-millis=30000
app.datasource.min-evictable-idle-time-millis=600000
app.datasource.num-tests-per-eviction-run=3

# Leak detection
app.datasource.remove-abandoned-on-borrow=true
app.datasource.remove-abandoned-timeout=60
app.datasource.log-abandoned=true

# Performance (prepared Statement caching)
app.datasource.pool-prepared-statements=true
app.datasource.max-open-prepared-statements=100