app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool Sizing (Fixed Size)
app.datasource.maximum-pool-size=10
app.datasource.minimum-idle=10
app.datasource.pool-name=MyAppPool

# Timeouts (in milliseconds)
app.datasource.connection-timeout=3000
app.datasource.validation-timeout=1000
app.datasource.max-lifetime=1740000
app.datasource.keepalive-time=300000

# Behavior & Diagnostics
app.datasource.auto-commit=false
app.datasource.leak-detection-threshold=2000

# Optional: Prepared Statement Caching (Example for MySQL)
app.datasource.data-source-properties.cachePrepStmts=true
app.datasource.data-source-properties.prepStmtCacheSize=250
app.datasource.data-source-properties.prepStmtCacheSqlLimit=2048

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE