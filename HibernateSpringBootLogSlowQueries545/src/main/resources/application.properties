spring.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Log queries taking longer than 1 millisecond
spring.jpa.properties.hibernate.log_slow_query=1

# Required logger level to output the slow query messages
logging.level.org.hibernate.SQL_SLOW=INFO