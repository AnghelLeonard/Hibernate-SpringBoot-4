# tag::config[]
# reWriteBatchedInserts lets PostgreSQL rewrite a batch of inserts into a single
# multi-value INSERT, clearing JdbcBatchToBulkInsertEvent (see batching below).
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb?\
  reWriteBatchedInserts=true
# end::config[]
spring.datasource.username=postgres
spring.datasource.password=root

# tag::config[]
# Connection-related.
# The pool disables autocommit, clearing SkipAutoCommitCheckEvent. Spring Boot
# detects this and sets provider_disables_autocommit for us, so one line is enough.
spring.datasource.hikari.auto-commit=false
spring.jpa.open-in-view=false

# Batching-related.
# JDBC batching with ordered inserts and updates, clearing JdbcBatchSizeEvent
# (reWriteBatchedInserts on the URL above completes the batching setup).
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Schema-related.
# The schema is owned by a migration script, clearing SchemaGenerationEvent.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Logging-related.
# SQL goes through a logger instead of System.out, clearing
# ConsoleStatementLoggingEvent.
logging.level.org.hibernate.SQL=debug

# Query-related. Clearing QueryPaginationCollectionFetchingEvent,
# QueryInClauseParameterPaddingEvent, and DefaultQueryPlanCacheMaxSizeEvent.
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
# end::config[]
