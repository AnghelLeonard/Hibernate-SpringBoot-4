spring.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=debug

# The mapping and the configuration are the ones we fixed in the previous item,
# so the startup scan is clean and every event in this module is a RUNTIME one.
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096

# Runtime thresholds. These are deliberately aggressive so the examples are quick
# and deterministic; in a real application you would set each one to whatever "too
# large" or "too long" means for your workload.
# tag::runtime-thresholds[]
# A query that returns more than this many rows reports a QueryResultListSizeEvent.
spring.jpa.properties.hypersistence.query.max_result_size=5
# A query that runs longer than this reports a QueryTimeoutEvent.
spring.jpa.properties.hypersistence.query.timeout_millis=100
# A session that stays open longer than this reports a SessionTimeoutEvent.
spring.jpa.properties.hypersistence.session.timeout_millis=100
# A flush that runs longer than this reports a SessionFlushTimeoutEvent.
spring.jpa.properties.hypersistence.session.flush_timeout_millis=100
# end::runtime-thresholds[]
