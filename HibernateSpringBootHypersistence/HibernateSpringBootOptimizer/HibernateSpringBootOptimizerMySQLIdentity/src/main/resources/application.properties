# tag::config[]
# rewriteBatchedStatements is the MySQL counterpart of PostgreSQL's
# reWriteBatchedInserts, collapsing a batch into a single multi-row statement.
spring.datasource.url=jdbc:mysql://localhost:3306/bookstoredb?\
  createDatabaseIfNotExist=true&rewriteBatchedStatements=true
# end::config[]
spring.datasource.username=root
spring.datasource.password=root

# tag::config[]
# Connection-related.
spring.datasource.hikari.auto-commit=false
spring.jpa.open-in-view=false

# The MySQL driver caches prepared statements only when asked, so enable it to
# clear the JdbcStatementCacheSizeEvent.
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=256
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# Batching-related.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Schema-related.
spring.jpa.hibernate.ddl-auto=none

# Logging-related.
logging.level.org.hibernate.SQL=debug

# Query-related.
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
# end::config[]
