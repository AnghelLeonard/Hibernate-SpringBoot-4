spring.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=debug

spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# A query that returns more than this many rows reports a QueryResultListSizeEvent,
# which the Event Persistence feature then stores as a runtime event.
spring.jpa.properties.hypersistence.query.max_result_size=5
