spring.datasource.url=jdbc:mysql://localhost:3306/bookstoredb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# The schema is created by a migration tool in production; here spring.sql.init
# plays that role, running the schema-${platform}.sql script before Hibernate
# bootstraps, so JsonType needs no columnDefinition and hbm2ddl stays off.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.platform=mysql

logging.level.net.ttddyy.dsproxy.listener=debug
spring.jpa.open-in-view=false
