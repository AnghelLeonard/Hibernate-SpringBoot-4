app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool sizing
app.datasource.initial-size=10
app.datasource.min-size=5
app.datasource.max-size=30

# Timeouts (Agroal uses seconds or ISO-8601 durations like 5s)
app.datasource.acquisition-timeout=5
app.datasource.validation-timeout=3
app.datasource.reap-timeout=600
app.datasource.max-lifetime=1800

# Connection validation and leak detection
app.datasource.idle-validation-timeout=60
app.datasource.leak-timeout=60

# Metrics and resource tracking
app.datasource.metrics=true
app.datasource.track-resources=true