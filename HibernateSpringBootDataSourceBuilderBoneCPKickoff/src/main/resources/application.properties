app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Connection Pool Sizing & Partitions
app.datasource.partitionCount=3
app.datasource.minConnectionsPerPartition=5
app.datasource.maxConnectionsPerPartition=10
app.datasource.acquireIncrement=5

# Connection Lifecycle & Performance
app.datasource.idleConnectionTestPeriodInMinutes=60
app.datasource.idleMaxAgeInMinutes=240
app.datasource.statementsCacheSize=100
app.datasource.releaseHelperThreads=3

app.datasource.poolName=MyAppBoneCPPool