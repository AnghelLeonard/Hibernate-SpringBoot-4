app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool sizing and fairness
app.datasource.pool-initial-size=10
app.datasource.pool-max-size=30
app.datasource.pool-fair=true
app.datasource.pool-enable-connection-tracking=true

# Timeouts and retries
app.datasource.connection-timeout-in-ms=5000
app.datasource.login-timeout-in-seconds=3
app.datasource.acquire-retry-attempts=3
app.datasource.acquire-retry-delay-in-ms=1000

# Validation and idle management
app.datasource.test-connection-query=isValid
app.datasource.connection-idle-limit-in-seconds=30
app.datasource.validate-timeout-in-seconds=3
app.datasource.reducer-time-interval-in-seconds=60

# Caching and diagnostics
app.datasource.statement-cache-max-size=200
app.datasource.log-query-execution-longer-than-ms=500
app.datasource.log-connection-longer-than-ms=5000