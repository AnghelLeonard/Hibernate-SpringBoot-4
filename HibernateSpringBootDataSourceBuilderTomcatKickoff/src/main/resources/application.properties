app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool sizing
app.datasource.initial-size=10
app.datasource.max-active=30
app.datasource.max-idle=15
app.datasource.min-idle=5

# Timeouts and concurrency (fail fast for web threads)
app.datasource.max-wait=5000

# Connection validation (high-speed validation caching)
app.datasource.test-on-borrow=true
app.datasource.test-while-idle=true
app.datasource.validation-query=SELECT 1
app.datasource.validation-query-timeout=3
app.datasource.validation-interval=30000

# Idle eviction and connection age
app.datasource.time-between-eviction-runs-millis=30000
app.datasource.min-evictable-idle-time-millis=600000
app.datasource.max-age=1800000

# Leak detection and recovery
app.datasource.remove-abandoned=true
app.datasource.remove-abandoned-timeout=60
app.datasource.log-abandoned=true
app.datasource.suspect-timeout=30

# Performance interceptors (statement caching and query tracking)
app.datasource.jdbc-interceptors=org.apache.tomcat.jdbc.pool.interceptor.ConnectionState;org.apache.tomcat.jdbc.pool.interceptor.StatementCache(max=100);org.apache.tomcat.jdbc.pool.interceptor.QueryTimeoutInterceptor(queryTimeout=30)

app.datasource.name=MyTomcatPool
