# Configuration for a web application (e-commerce)
app.datasource.ds1.url=jdbc:postgresql://localhost:5432/postgres
app.datasource.ds1.username=postgres
app.datasource.ds1.password=root

# Pool sizing
app.datasource.ds1.maximum-pool-size=15
app.datasource.ds1.minimum-idle=15

# Timeouts (in milliseconds)
app.datasource.ds1.connection-timeout=5000
app.datasource.ds1.validation-timeout=2500
app.datasource.ds1.idle-timeout=600000
app.datasource.ds1.max-lifetime=1740000
app.datasource.ds1.keepalive-time=120000

# Diagnostics and behavior
app.datasource.ds1.leak-detection-threshold=10000
app.datasource.ds1.auto-commit=false

# Configuraion for an ETL application
app.datasource.ds2.url=jdbc:postgresql://localhost:5432/postgres
app.datasource.ds2.username=postgres
app.datasource.ds2.password=root

# Pool sizing (elastic to release resources between batch runs)
app.datasource.ds2.maximum-pool-size=10
app.datasource.ds2.minimum-idle=2

# Timeouts (in milliseconds - generous for long-running queries and locks)
app.datasource.ds2.connection-timeout=60000
app.datasource.ds2.validation-timeout=5000
app.datasource.ds2.idle-timeout=300000
app.datasource.ds2.max-lifetime=3600000
app.datasource.ds2.keepalive-time=120000

# Diagnostics and behavior
app.datasource.ds2.leak-detection-threshold=0
app.datasource.ds2.auto-commit=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql