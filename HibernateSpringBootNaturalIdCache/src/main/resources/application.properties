spring.datasource.url=jdbc:mysql://localhost:3306/bookstoredb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.generate-dll=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# 1. Enable Hibernate L2 and Query Caching
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true

# 2. Tell Hibernate to use JCache (which wraps Ehcache 3)
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory

# 3. Supply the JCache provider configuration specifically for Hibernate
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.javax.cache.uri=classpath:ehcache.xml

# Optional: Ensure Spring Boot doesn't spin up a separate, conflicting CacheManager 
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

spring.jpa.properties.hibernate.generate_statistics=true

# this will help you to see every single move that happens into Second Level Cache(L2)
logging.level.ROOT=TRACE 