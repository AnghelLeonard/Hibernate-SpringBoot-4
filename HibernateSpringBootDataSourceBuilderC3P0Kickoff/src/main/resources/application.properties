app.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
app.datasource.username=postgres
app.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool sizing and growth
app.datasource.initialPoolSize=10
app.datasource.minPoolSize=5
app.datasource.maxPoolSize=30
app.datasource.acquireIncrement=5

# Timeouts and concurrency (fail fast for web threads)
app.datasource.checkoutTimeout=5000
app.datasource.acquireRetryAttempts=3
app.datasource.acquireRetryDelay=1000

# Connection validation and idle cleanup (prevent broken pipes)
app.datasource.preferredTestQuery=SELECT 1
app.datasource.idleConnectionTestPeriod=60
app.datasource.maxIdleTime=600
app.datasource.maxIdleTimeExcessConnections=180
app.datasource.testConnectionOnCheckout=false
app.datasource.testConnectionOnCheckin=true

# Statement caching and helper threads
app.datasource.maxStatements=150
app.datasource.maxStatementsPerConnection=10
app.datasource.numHelperThreads=6

# Leak Detection and recovery
app.datasource.unreturnedConnectionTimeout=60
app.datasource.debugUnreturnedConnectionStackTraces=true

app.datasource.dataSourceName=MyC3P0Pool