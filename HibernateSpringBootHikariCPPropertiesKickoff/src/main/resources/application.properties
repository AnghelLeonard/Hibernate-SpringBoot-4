spring.datasource.url=jdbc:postgresql://localhost:5432/bookstoredb
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Pool Sizing (Fixed Size)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.pool-name=MyAppPool

# Timeouts (in milliseconds)
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.keepalive-time=300000

# Behavior & Diagnostics
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.leak-detection-threshold=2000

# Optional: Prepared Statement Caching (Example for MySQL)
#spring.datasource.hikari.data-source-properties.cachePrepStmts=true
#spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
#spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# register HikariCP JMX MBeans (allows live inspection via JConsole/VisualVM)
spring.datasource.hikari.register-mbeans=true

# expose Actuator web endpoints (by default, only 'health' is exposed over HTTP)
management.endpoints.web.exposure.include=health,metrics,prometheus

# Optional: Enable percentile histograms for connection acquisition and usage times
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.usage=true

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE